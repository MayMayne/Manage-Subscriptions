name: Build Unsigned IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks || true

      - name: Install ldid
        run: |
          brew install ldid 2>/dev/null || brew install ProcursusTeam/ldid/ldid
          ldid -v || true

      # Signed with a throwaway identity so the entitlement-bearing build runs;
      # the entitlements are stripped again below and re-applied with ldid.
      - name: Build
        run: |
          set -euo pipefail
          SIGNING="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= EXPANDED_CODE_SIGN_IDENTITY="
          EXTRA="ENABLE_PREVIEWS=NO ENABLE_ON_DEMAND_RESOURCES=NO ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS=NO ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO SUPPORTED_PLATFORMS=iphoneos IPHONEOS_DEPLOYMENT_TARGET=16.0 COMPILER_INDEX_STORE_ENABLE=NO"
          xcodebuild build \
            -project sandbox.xcodeproj \
            -target sandbox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            $SIGNING $EXTRA

      - name: Package unsigned IPA with entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/sandbox.app"
          test -d "$APP" || { echo "app not found"; find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3; exit 1; }

          # Drop whatever signature Xcode produced, then sign with ldid so the
          # App Group entitlement survives for TrollStore / Sideloadly.
          codesign --remove "$APP" 2>/dev/null || true
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          ldid -Ssandbox/sandbox.entitlements "$APP"
          echo "--- entitlements ---"
          ldid -e "$APP" || true

          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$APP" "$RUNNER_TEMP/export/Payload/"
          cd "$RUNNER_TEMP/export"
          zip -qry sandbox-worse-query.ipa Payload
          ls -lh sandbox-worse-query.ipa
          unzip -l sandbox-worse-query.ipa | head -20

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
