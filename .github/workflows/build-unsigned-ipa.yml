name: Build Unsigned IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          # Prefer the newest Xcode installed on the runner: the project uses
          # the Xcode 16+ project format (objectVersion 77).
          BEST=""
          BEST_VER="0"
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            VER=$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo 0)
            MAJOR=${VER%%.*}
            case "$MAJOR" in ''|*[!0-9]*) MAJOR=0;; esac
            if [ "$MAJOR" -gt "$BEST_VER" ]; then BEST_VER="$MAJOR"; BEST="$APP"; fi
          done
          if [ -n "$BEST" ]; then
            sudo xcode-select -s "$BEST/Contents/Developer"
            echo "Using $BEST"
          fi
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | head -20

      - name: Install iOS simulator runtime
        run: |
          # actool refuses to build the asset catalog when no runtime matches
          # the SDK (macos-26 images ship Xcode 26.0 without a runtime).
          xcrun simctl runtime list 2>/dev/null | head -20 || true
          xcodebuild -downloadPlatform iOS -buildVersion '23A339' \
            || xcodebuild -downloadPlatform iOS \
            || echo "runtime download failed; continuing"
          xcrun simctl runtime list 2>/dev/null | head -20 || true

      - name: Install ldid
        run: |
          brew install ldid 2>/dev/null || brew install ProcursusTeam/ldid/ldid
          ldid -v || true

      - name: Build
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          SIGNING="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= EXPANDED_CODE_SIGN_IDENTITY="
          # actool needs a simulator runtime matching the SDK; with the runtime
          # installed the asset catalog builds normally.
          EXTRA="ENABLE_PREVIEWS=NO ENABLE_ON_DEMAND_RESOURCES=NO ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS=NO ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO SUPPORTED_PLATFORMS=iphoneos IPHONEOS_DEPLOYMENT_TARGET=16.0 COMPILER_INDEX_STORE_ENABLE=NO CONFIGURATION_BUILD_DIR=$OUT"
          if ! xcodebuild build \
            -project sandbox.xcodeproj \
            -target sandbox \
            -configuration Release \
            -sdk iphoneos \
            $SIGNING $EXTRA; then
            echo "::warning::build with the asset catalog failed; retrying without it"
            # The app icon is cosmetic: build again skipping the catalog so a
            # runtime problem on the runner cannot block the IPA.
            rm -rf "$OUT"
            mv sandbox/Assets.xcassets "$RUNNER_TEMP/Assets.xcassets"
            xcodebuild build \
              -project sandbox.xcodeproj \
              -target sandbox \
              -configuration Release \
              -sdk iphoneos \
              $SIGNING $EXTRA \
              ASSETCATALOG_COMPILER_APPICON_NAME= ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME=
            mv "$RUNNER_TEMP/Assets.xcassets" sandbox/Assets.xcassets
          fi

          APP="$OUT/sandbox.app"
          if [ ! -d "$APP" ]; then
            echo "sandbox.app not at $APP; searching"
            APP=$(find "$RUNNER_TEMP" -maxdepth 6 -name 'sandbox.app' -type d | head -1)
          fi
          test -d "$APP" || { echo "::error::app bundle not found"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package unsigned IPA with entitlements
        run: |
          set -euo pipefail
          APP="$APP"

          # Drop whatever signature Xcode produced, then sign with ldid so the
          # App Group entitlement survives for TrollStore / Sideloadly.
          codesign --remove "$APP" 2>/dev/null || true
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          ldid -Ssandbox/sandbox.entitlements "$APP"
          echo "--- embedded entitlements ---"
          ldid -e "$APP" || true

          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$APP" "$RUNNER_TEMP/export/Payload/"
          cd "$RUNNER_TEMP/export"
          zip -qry sandbox-worse-query.ipa Payload
          ls -lh sandbox-worse-query.ipa
          unzip -l sandbox-worse-query.ipa | head -20

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
